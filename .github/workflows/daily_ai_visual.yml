name: Daily AI Visual Carousel Automation

on:
  schedule:
    # Runs every day at 1:30 PM IST (08:00 AM UTC)
    - cron: '0 8 * * *'
  # Allows manual triggering with 1-click in GitHub
  workflow_dispatch:

jobs:
  post-visual-carousel:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright boto3 requests
          python -m playwright install --with-deps chromium

      - name: Generate and Publish Visual Carousel
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
        run: |
          python daily_ai_visual_carousel.py --now

      - name: Commit and Push Updated History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add visual_history.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update visual carousel history [skip ci]"
            git push
          fi
