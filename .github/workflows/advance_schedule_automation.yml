name: Rolling Advance Carousel Automation (2 Days Ahead)

on:
  schedule:
    # Runs daily at 7:30 AM IST (02:00 AM UTC) to generate and schedule Day + 2
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Scheduling mode'
        required: true
        default: 'daily-roll'
        type: choice
        options:
          - 'daily-roll'
          - 'init-2days'

jobs:
  advance-scheduler:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright boto3 requests
          python -m playwright install --with-deps chromium

      - name: Run Advance Schedule Orchestrator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_TOKEN: ${{ secrets.BUFFER_API_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPADATA_KEY: ${{ secrets.SUPADATA_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_DOMAIN: ${{ secrets.R2_PUBLIC_DOMAIN }}
        run: |
          if [ "${{ github.event.inputs.action }}" = "init-2days" ]; then
            python orchestrate_advance_schedule.py --init-2days
          else
            python orchestrate_advance_schedule.py --daily-roll
          fi

      - name: Commit and Push Updated History and Guides
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ history.json visual_history.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update advance carousel history and companion guides [skip ci]"
            git push
          fi
